name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.PR_SUMMARY_WRITER_API_KEY }}
        run: |
          python -m unittest discover -s tests
